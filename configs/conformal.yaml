# Conformal prediction. The evaluation was fixed in Section 4 of the analysis plan before any model was fitted.

# nominal coverage and the quantiles used as the ends of the CQR interval
quantiles: [0.025, 0.05, 0.10, 0.90, 0.95, 0.975]
levels:
  0.80: [0.10, 0.90]
  0.90: [0.05, 0.95]
  0.95: [0.025, 0.975]
primary_level: 0.90
primary_target: sbp

bootstrap: 2000            # bootstrap resamples of patients (analysis plan, Section 4.2)
min_subjects_per_stratum: 30   # smaller strata are reference only (Section 4.3); Mondrian groups use the overall correction

# cut points of the strata (analysis plan, Section 4.3; fixed)
strata:
  sbp: [90, 100, 120, 140, 160]
  dbp: [50, 60, 70, 80, 90]
  age: [40, 60, 75]
  bmi: [18.5, 25, 30]
  pulse_rate: [60, 80, 100]
  within_subject: [-20, 20]   # difference from the patient's own median SBP

# numbers of calibration patients to try (analysis plan, Section 5)
calibration_sizes: [10, 20, 45, 100, 200, 400, 627]
calibration_repeats: 200

# recalibration with a few target patients (analysis plan, Section 6.3)
recalibration:
  patients: [5, 10, 20, 50, 100]
  repeats: 200

# classifier that tells VitalDB from the target dataset (weighted conformal prediction, analysis plan, Section 6.2)
domain_classifier:
  segments_per_patient: 40   # training segments drawn per VitalDB training patient (with replacement, then unique)
  params:
    n_estimators: 200
    learning_rate: 0.05
    num_leaves: 31
    min_child_samples: 100
    subsample: 0.8
    subsample_freq: 1
    colsample_bytree: 0.8
    class_weight: balanced
    n_jobs: 4
    verbose: -1
